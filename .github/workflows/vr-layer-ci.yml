name: VR-Layer CI

on:
  push:
    branches: ['**']
    paths: ['vr_layer/**', '.github/workflows/vr-layer-ci.yml']
  pull_request:
    paths: ['vr_layer/**', '.github/workflows/vr-layer-ci.yml']
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  build-layer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Hinweis: pwsh-Runner nutzen ErrorActionPreference=Stop und behandeln
      # Stderr nativer Befehle als Fehler. Beide Schritte schalten das explizit
      # ab und werten stattdessen den Exit-Code aus.
      - name: CMake konfigurieren (x64)
        id: configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cmake -S vr_layer -B vr_layer/build -A x64 2>&1 | Tee-Object -FilePath ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: DLL bauen (Release)
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --build vr_layer/build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Artefakte pruefen
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $dir = "vr_layer\build\Release"
            Get-ChildItem $dir | ForEach-Object { Write-Host ("{0,8:N1} KB  {1}" -f ($_.Length/1KB), $_.Name) }
            if (-not (Test-Path "$dir\XR_APILAYER_PitBossR3E_VR.dll")) { throw "DLL fehlt im Build" }
            if (-not (Test-Path "$dir\pitboss_vr_layer.json")) { throw "Manifest fehlt im Build" }
          } catch {
            ("FEHLER: " + $_ | Out-String) | Tee-Object -FilePath check.log
            exit 1
          }

      - name: Layer-Artefakte hochladen
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: pitboss-vr-layer
          path: |
            vr_layer/build/Release/XR_APILAYER_PitBossR3E_VR.dll
            vr_layer/build/Release/pitboss_vr_layer.json
          if-no-files-found: error

      # Diagnose: Bei Fehlschlag Schritt-Ergebnisse und die letzten Zeilen der
      # Build-Ausgabe als Kommentar an Issue #2 posten (die Logs sind sonst nur
      # nach Anmeldung einsehbar). PoC-Hilfsmittel, wird mit der Integration
      # entfernt.
      - name: Fehlerauszug an Issue 2 posten
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $bt = [string][char]96
          $fence = $bt + $bt + $bt
          $nl = [string][char]10
          $outcomes = "Schritt-Ergebnisse: configure=${{ steps.configure.outcome }} build=${{ steps.build.outcome }} check=${{ steps.check.outcome }} upload=${{ steps.upload.outcome }}"
          $parts = @()
          foreach ($f in @("ci.log", "build.log", "check.log")) {
            if (Test-Path $f) {
              $tail = (Get-Content $f | Select-Object -Last 60) -join $nl
              $parts += ("### " + $f + $nl + $fence + $nl + $tail + $nl + $fence)
            }
          }
          if ($parts.Count -eq 0) { $parts = @("Keine Logdatei gefunden (Fehler vor CMake).") }
          $body = ("VR-Layer CI fehlgeschlagen auf " + $bt + $bt + $env:GITHUB_SHA.Substring(0,8) + $bt + $bt + $nl + $nl + $outcomes + $nl + $nl + ($parts -join ($nl + $nl)))
          gh issue comment 2 --body $body