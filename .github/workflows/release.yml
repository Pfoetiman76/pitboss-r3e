name: Build & Release

on:
  push:
    tags: ['v*']          # Release wird bei Tags wie v0.4.7.6 gebaut
    branches: ['v*']      # 0.4.2.11-CI: gleicher Trigger auch ueber Release-Zweige
                           # (Zweig v0.4.2.11 = main-Stand; Build erzeugt das Release
                           # samt Tag selbst - kein manuelles Release-Anlegen mehr noetig)
  workflow_dispatch: {}    # manuell ausloesbar

permissions:
  contents: write          # noetig, um Release-Assets anzuhaengen

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45  # 0.5.9.19: Netz-Haenger (Download verbindet, liefert aber keine Daten) sonst bis zu 6h Default-Timeout
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Abhaengigkeiten
        run: pip install PySide6 pywin32 pyinstaller

      - name: Version aus Tag ableiten
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 0.4.2.9-CI: Piper + Stimme cachen. Beim Release-Build vom 08.11.2026 scheiterte
      # der Piper-Download an GitHub-504-Ausfaellen (Server kurzzeitig ueberlastet) und
      # riss den ganzen Build. Mit Cache laedt jeder folgende Build die Dateien nur noch
      # einmal herunter und ist danach gegen solche Ausfaelle immun.
      - name: Piper-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: piper
          key: piper-win-2023.11.14-2-thorsten-high-v1

      - name: Piper + deutsche Stimme (Thorsten high) buendeln (offline im Installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path piper | Out-Null
          # 0.4.2.9-CI: Bei Cache-Hit (frueherer Build erfolgreich) gar kein Download.
          $onnx_cached = Get-Item 'piper/de_DE-thorsten-high.onnx' -ErrorAction SilentlyContinue
          if ((Test-Path 'piper/piper.exe') -and $onnx_cached -and $onnx_cached.Length -ge 20MB) {
            Write-Host 'Piper + Stimme aus dem Cache vorhanden - Download uebersprungen.'
          } else {
          # 0.5.7.1: robuster Download per curl.exe - folgt HF-LFS-Redirects, streamt auf
          # Platte (kein Speicher-Puffer wie Invoke-WebRequest) und wiederholt bei Abbruch
          # ("The response ended prematurely"). Mehrere Quellen als Fallback.
          function FetchOne($url, $out) {
            # 0.5.9.19: --max-time zusaetzlich zu --connect-timeout, weil connect-timeout NUR die
            # Verbindungsphase deckt - eine Verbindung, die zwar aufbaut aber dann keine Daten mehr
            # liefert (Netz-Haenger), lief bisher unbegrenzt weiter (bis zum 6h-Default-Job-Timeout).
            curl.exe -L --fail --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 180 -o $out $url
            return ($LASTEXITCODE -eq 0)
          }
          function Fetch($urls, $out) {
            foreach ($u in $urls) {
              Write-Host "Download: $u"
              if (FetchOne $u $out) { return }
              Write-Host "  fehlgeschlagen, naechste Quelle ..."
            }
            throw "Alle Quellen fehlgeschlagen fuer $out"
          }
          # Piper-Binary (MIT, self-contained). 0.4.2.9-CI: Der Download von
          # github.com fiel am 08.11.2026 mehrfach mit HTTP 504 aus (GitHub war
          # einige Minuten ueberlastet). Deshalb: 5 Versuchsrunden mit Pause
          # (jede Runde widerholt intern noch 6x) und als letzte Rueckfallebene
          # die gh-CLI - sie laedt ueber api.github.com statt ueber die
          # Download-Weiterleitung von github.com.
          $piper_ok = $false
          foreach ($i in 1..5) {
            try {
              Fetch @('https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip') 'piper.zip'
              $piper_ok = $true
              break
            } catch {
              Write-Host "Piper-Download Versuch $i von 5 fehlgeschlagen - warte 30 s ..."
              Start-Sleep -Seconds 30
            }
          }
          if (-not $piper_ok) {
            Write-Host 'Letzter Fallback: gh-CLI (api.github.com) fuer das Piper-Binary'
            gh release download 2023.11.14-2 --repo rhasspy/piper --pattern 'piper_windows_amd64.zip' --output piper.zip --clobber
          }
          Expand-Archive piper.zip -DestinationPath piper_tmp -Force
          Copy-Item piper_tmp/piper/* piper/ -Recurse -Force
          # Deutsche Stimme Thorsten (high): 0.5.9.20 - eigenes GitHub-Release-Asset als
          # bevorzugte Quelle (siehe unten "piper-assets"). Grund: die beiden bisherigen
          # Hugging-Face-URLs (Tag v1.0.0 und main) sehen nach zwei Quellen aus, landen aber
          # BEIDE auf demselben CDN-Host us.aws.cdn.hf.co - bei einem HF-CDN-Ausfall (wie
          # gerade) bringt der "Fallback" also gar nichts. Das eigene Release-Asset liegt auf
          # GitHubs eigener Infrastruktur und ist unabhaengig von Hugging Faces Verfuegbarkeit.
          # HF bleibt als letzter Notnagel drin, falls das Asset mal fehlt/veraltet ist.
          $vown  = 'https://github.com/Pfoetiman76/pitboss/releases/download/piper-assets'
          $vtag  = 'https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/de/de_DE/thorsten/high'
          $vmain = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high'
          Fetch @("$vown/de_DE-thorsten-high.onnx",      "$vtag/de_DE-thorsten-high.onnx",      "$vmain/de_DE-thorsten-high.onnx")      'piper/de_DE-thorsten-high.onnx'
          Fetch @("$vown/de_DE-thorsten-high.onnx.json", "$vtag/de_DE-thorsten-high.onnx.json", "$vmain/de_DE-thorsten-high.onnx.json") 'piper/de_DE-thorsten-high.onnx.json'
          # Fail-Loud: Binary + vollstaendige Stimme (nicht abgeschnitten) muessen vorhanden sein
          if (-not (Test-Path 'piper/piper.exe')) { throw 'piper.exe fehlt nach Download' }
          $onnx = Get-Item 'piper/de_DE-thorsten-high.onnx' -ErrorAction SilentlyContinue
          if (-not $onnx)            { throw 'Thorsten-High-Stimme fehlt nach Download' }
          if ($onnx.Length -lt 20MB) { throw "Thorsten-High-Stimme unvollstaendig ($([math]::Round($onnx.Length/1MB,1)) MB)" }
          Write-Host ("Stimme OK: {0:N1} MB" -f ($onnx.Length/1MB))
          }
          Get-ChildItem piper

      - name: PyInstaller-Build
        shell: pwsh
        run: |
          pyinstaller installer/pitboss_r3e.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller fehlgeschlagen (Exit $LASTEXITCODE)" }
          # 0.4.2.10-CI Fail-Loud: Der Voll-Installer braucht die Piper-Stimme im
          # Build. PyInstaller 6 legt Datendateien unter _internal ab.
          if (-not (Test-Path 'dist/PitBossR3E/_internal/piper/piper.exe')) {
            throw "piper.exe fehlt in dist/PitBossR3E/_internal/piper - Piper-Schritt oder Spec pruefen!"
          }

      # 0.2.6: Groesse des Builds dokumentieren (Verschlanke-Kontrolle)
      - name: Dist-Groesse ausgeben
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\PitBossR3E -Recurse -File
          $sum = ($files | Measure-Object Length -Sum).Sum
          Write-Host ("dist gesamt: {0:N1} MB ({1} Dateien)" -f ($sum/1MB), $files.Count)
          Write-Host "Die 25 groessten Dateien:"
          $files | Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { Write-Host ("{0,10:N2} MB  {1}" -f ($_.Length/1MB), $_.FullName.Replace('$PWD\', '')) }
          $piper = $files | Where-Object { $_.FullName -match 'piper' }
          if ($piper) {
            $psum = ($piper | Measure-Object Length -Sum).Sum
            Write-Host ("davon piper/Stimme: {0:N1} MB" -f ($psum/1MB))
          }

      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress

      # 0.4.2.10-CI: Voll und Lite GETRENNT bauen. Frueher scheiterte der
      # Voll-Bau still (falscher piper-Pfad in setup.iss), der Lite-Bau
      # ueberschrieb den Fehlercode - der Schritt blieb gruen, und an JEDEM
      # Release haengt nur der Lite-Installer (ohne Piper-Stimme).
      # Naechste Version: Lite-Installer mit eigenem Icon (LITE-Banner unten,
      # PitBoss-Tuerkis). Das Skript erzeugt die Icon-Datei aus dem Original,
      # setup.iss waehlt sie per #ifdef LITE aus. Voll-Installer bleibt unveraendert.
      - name: Lite-Icon erzeugen
        shell: pwsh
        run: |
          python scripts\make_lite_icon.py
          if ($LASTEXITCODE -ne 0) { throw "Lite-Icon-Erzeugung fehlgeschlagen (Exit $LASTEXITCODE)" }
          if (-not (Test-Path 'assets/pitboss_app_icon_lite.ico')) { throw 'assets/pitboss_app_icon_lite.ico fehlt' }

      - name: Installer bauen (Voll, mit Piper-Stimme)
        shell: pwsh
        run: |
          iscc installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Voll-Installer fehlgeschlagen (Exit $LASTEXITCODE)" }

      - name: Installer bauen (Lite)
        shell: pwsh
        run: |
          iscc /DLITE installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Lite-Installer fehlgeschlagen (Exit $LASTEXITCODE)" }
          Get-ChildItem installer\Output | ForEach-Object { Write-Host ("{0,10:N2} MB  {1}" -f ($_.Length/1MB), $_.Name) }

      # 0.4.2.10-CI Fail-Loud vor dem Upload: Beide Installer muessen existieren,
      # der Voll-Installer muss die Piper-Stimme enthalten (dazu deutlich
      # groesser als Lite sein).
      - name: Installer pruefen
        shell: pwsh
        run: |
          $full = Get-ChildItem 'installer/Output/PitBossR3E-Setup-*.exe' |
                  Where-Object { $_.Name -notmatch 'Lite' } | Select-Object -First 1
          if (-not $full) { throw 'Voll-Installer fehlt in installer/Output (nur Lite gebaut?)' }
          if ($full.Length -lt 50MB) { throw "Voll-Installer verdaechtig klein ($([math]::Round($full.Length/1MB,1)) MB < 50 MB) - Piper-Stimme vermutlich nicht enthalten" }
          Write-Host ("Voll-Installer OK: {0:N1} MB ({1})" -f ($full.Length/1MB), $full.Name)

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v3
        with:
          files: installer/Output/PitBossR3E-Setup-*.exe
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}   # 0.4.2.11-CI: Release/Tag entstehen aus dem Zweignamen, falls der Push ein Zweig war
